<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGAJI 05</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#efeaf5;padding-bottom:90px}
.top{background:#3b1a5a;color:#fff;position:relative;padding:10px 12px 16px;text-align:center}
.topRow{display:flex;justify-content:space-between;align-items:center}
.btnTamu{background:#fff;border:1px solid #d4a017;color:#3b1a5a;padding:6px 14px;border-radius:20px;font-weight:bold}
.btnKunci{background:#fff;border:1px solid #d4a017;width:42px;height:42px;border-radius:50%;font-size:20px}
.logoWrap{width:150px;height:150px;margin:8px auto;border-radius:50%;overflow:hidden;border:4px solid #d4a017;box-shadow:0 0 0 3px #fff,0 4px 10px rgba(0,0,0,.3)}
.logoWrap img{width:100%;height:100%;object-fit:cover;display:block}
.top h1{font-size:30px;margin-top:8px}
.top p{font-size:15px;opacity:.85;margin-top:4px}
.main{padding:14px 14px 0}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer}
.card b{color:#3b1a5a;font-size:19px}
.card small{display:block;color:#666;margin-top:6px;font-size:14px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0 14px;border-top:1px solid #eee}
.bottom button{background:none;border:none;font-size:13px;color:#555;display:flex;flex-direction:column;align-items:center}
.bottom button.active{color:#3b1a5a;font-weight:bold}
.bottom span{font-size:22px}
</style>
</head>
<body>
<div class="top">
<div class="topRow">
<button class="btnTamu">Tamu</button>
<button class="btnKunci">🔑</button>
</div>
<div class="logoWrap"><img src="logo.png"></div>
<h1>NGAJI 05</h1>
<p>RW 05 Cilebut Barat</p>
</div>
<div class="main">
<div class="card"><b>📖 Info Pengajian Hari Ini</b></div>
<div class="card"><b>📢 Pengumuman RW 05</b></div>
<div class="card"><b>ℹ️ Info Umum Warga</b><small>Harus ACC Bos Ampeg dulu.</small></div>
<div class="card"><b>📸 Photo Hari Ini</b><small>Bebas upload + kata-kata. Nunggu ACC Bos Ampeg / RW / RT / Humas.</small></div>
</div>
<div class="bottom">
<button class="active"><span>🏠</span>Beranda</button>
<button><span>📖</span>Pengajian</button>
<button><span>🕌</span>Petugas Jum'at</button>
<button><span>💬</span>Lapor</button>
<button><span>👤</span>Profil</button>
</div>
</body>
</html>
